<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="620" fill="#FFFFFF"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1A2E">Network Topology — dev &amp; prod (identical shape, isolated address space)</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#5C6B8A">No peering between environments — each VNet is fully self-contained</text>

  <!-- DEV VNet -->
  <g>
    <rect x="40" y="90" width="440" height="480" rx="10" fill="#F4F7FE" stroke="#1E2761" stroke-width="2"/>
    <text x="260" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">DEV — vnet-itsolutions-webplat-dev-uks-001</text>
    <text x="260" y="140" text-anchor="middle" font-size="11.5" fill="#5C6B8A">10.30.0.0/16</text>

    <rect x="70" y="165" width="380" height="120" rx="6" fill="#FFFFFF" stroke="#9AA7CE"/>
    <text x="260" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A2E">snet-aks</text>
    <text x="260" y="208" text-anchor="middle" font-size="10.5" fill="#5C6B8A">10.30.0.0/20  (4,096 addresses)</text>
    <text x="260" y="226" text-anchor="middle" font-size="10" fill="#5C6B8A">AKS nodes + pods (standard Azure CNI)</text>
    <text x="260" y="242" text-anchor="middle" font-size="10" fill="#5C6B8A">NSG: no direct inbound from Internet</text>
    <text x="260" y="258" text-anchor="middle" font-size="10" fill="#5C6B8A">reachable only via the Gateway path</text>

    <rect x="70" y="300" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#9AA7CE"/>
    <text x="260" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A2E">snet-appgw</text>
    <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#5C6B8A">10.30.16.0/24</text>
    <text x="260" y="361" text-anchor="middle" font-size="10" fill="#5C6B8A">NSG: 443/80 from Internet,</text>
    <text x="260" y="376" text-anchor="middle" font-size="10" fill="#5C6B8A">65200-65535 from GatewayManager</text>

    <rect x="70" y="405" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#9AA7CE"/>
    <text x="260" y="430" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A2E">snet-pe</text>
    <text x="260" y="448" text-anchor="middle" font-size="10.5" fill="#5C6B8A">10.30.17.0/24</text>
    <text x="260" y="466" text-anchor="middle" font-size="10" fill="#5C6B8A">Private endpoints: ACR, Key Vault</text>
    <text x="260" y="481" text-anchor="middle" font-size="10" fill="#5C6B8A">NSG: deny all except from the VNet</text>

    <text x="260" y="550" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A1A2E">dev-webplat.ict-cloud.solutions</text>
    <text x="260" y="566" text-anchor="middle" font-size="9.5" fill="#5C6B8A">real DNS, publicly resolvable</text>
  </g>

  <!-- PROD VNet -->
  <g>
    <rect x="520" y="90" width="440" height="480" rx="10" fill="#F4F7FE" stroke="#1E2761" stroke-width="2"/>
    <text x="740" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2761">PROD — vnet-itsolutions-webplat-prod-uks-001</text>
    <text x="740" y="140" text-anchor="middle" font-size="11.5" fill="#5C6B8A">10.31.0.0/16</text>

    <rect x="550" y="165" width="380" height="120" rx="6" fill="#FFFFFF" stroke="#9AA7CE"/>
    <text x="740" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A2E">snet-aks</text>
    <text x="740" y="208" text-anchor="middle" font-size="10.5" fill="#5C6B8A">10.31.0.0/20  (4,096 addresses)</text>
    <text x="740" y="226" text-anchor="middle" font-size="10" fill="#5C6B8A">AKS nodes + pods (standard Azure CNI)</text>
    <text x="740" y="242" text-anchor="middle" font-size="10" fill="#5C6B8A">NSG: no direct inbound from Internet</text>
    <text x="740" y="258" text-anchor="middle" font-size="10" fill="#5C6B8A">reachable only via the Gateway path</text>

    <rect x="550" y="300" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#9AA7CE"/>
    <text x="740" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A2E">snet-appgw</text>
    <text x="740" y="343" text-anchor="middle" font-size="10.5" fill="#5C6B8A">10.31.16.0/24</text>
    <text x="740" y="361" text-anchor="middle" font-size="10" fill="#5C6B8A">NSG: 443/80 from Internet,</text>
    <text x="740" y="376" text-anchor="middle" font-size="10" fill="#5C6B8A">65200-65535 from GatewayManager</text>

    <rect x="550" y="405" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#9AA7CE"/>
    <text x="740" y="430" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A2E">snet-pe</text>
    <text x="740" y="448" text-anchor="middle" font-size="10.5" fill="#5C6B8A">10.31.17.0/24</text>
    <text x="740" y="466" text-anchor="middle" font-size="10" fill="#5C6B8A">Private endpoints: ACR, Key Vault</text>
    <text x="740" y="481" text-anchor="middle" font-size="10" fill="#5C6B8A">NSG: deny all except from the VNet</text>

    <text x="740" y="550" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A1A2E">www.itsolutions.example.com</text>
    <text x="740" y="566" text-anchor="middle" font-size="9.5" fill="#E4572E">placeholder — domain not yet registered</text>
  </g>
</svg>
