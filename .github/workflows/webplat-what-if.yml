name: Webplat What-If Deployment

# Runs `az deployment group what-if` for the webplat infra on each PR so
# reviewers can see the exact resource-level impact before merge. Requires
# federated OIDC credentials scoped to this workload (AZURE_CLIENT_ID_WEBPLAT
# / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) - see docs/webplat-architecture.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'bicep/webplat.bicep'
      - 'bicep/params/webplat-*.bicepparam'
      - 'modules/network.bicep'
      - 'modules/acr.bicep'
      - 'modules/aks.bicep'
      - 'modules/appgw-ingress.bicep'
      - '.github/workflows/webplat-what-if.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  what-if:
    name: What-If (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check resource group variable is configured
        id: check-rg
        run: |
          if [ -z "${{ vars[format('RESOURCE_GROUP_{0}_WEBPLAT', matrix.environment)] }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RESOURCE_GROUP_${{ matrix.environment }}_WEBPLAT is not set - skipping What-If for ${{ matrix.environment }}. This means CI isn't wired to that resource group, not necessarily that it doesn't exist in Azure."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.check-rg.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WEBPLAT }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run What-If
        if: steps.check-rg.outputs.configured == 'true'
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars[format('RESOURCE_GROUP_{0}_WEBPLAT', matrix.environment)] }}
          template: bicep/webplat.bicep
          parameters: bicep/params/webplat-${{ matrix.environment }}.bicepparam
          deploymentMode: Incremental
          additionalArguments: --what-if --what-if-result-format FullResourcePayloads
          # What-If is read-only; don't fail on the pre-existing benign
          # BCP334 length-validation warnings az CLI writes to stderr.
          failOnStdErr: false

      - name: Comment What-If result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const configured = '${{ steps.check-rg.outputs.configured }}' === 'true';
            const body = configured
              ? `#### Webplat What-If (${{ matrix.environment }})\n\nSee job logs for the full resource-level diff: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              : `#### Webplat What-If (${{ matrix.environment }})\n\nSkipped - \`RESOURCE_GROUP_${{ matrix.environment }}_WEBPLAT\` isn't set, so this pipeline doesn't know which resource group to target.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
