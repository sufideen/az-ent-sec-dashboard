name: Webplat App Deploy

# Deploys the demo app onto the private AKS cluster via `az aks command
# invoke` - this is what lets a GitHub-hosted runner (no VNet line-of-sight)
# reach a cluster with no public API server, with zero extra networking
# (no VPN, self-hosted runner, or Bastion required).

on:
  workflow_run:
    workflows: ["Webplat Build & Push Demo App"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy the app to'
        type: choice
        options: [dev, prod]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy app - Dev
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event.inputs.environment == '' || github.event.inputs.environment == 'dev') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WEBPLAT }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set image reference
        run: |
          sed -i \
            -e "s#REPLACE_WITH_ACR_LOGIN_SERVER#${{ vars.ACR_NAME_DEV }}.azurecr.io#g" \
            -e "s#REPLACE_WITH_IMAGE_TAG#${{ github.event.workflow_run.head_sha || github.sha }}#g" \
            k8s/overlays/dev/kustomization.yaml
      - name: Install cert-manager (idempotent; dev uses Let's Encrypt for TLS)
        run: |
          RESULT=$(az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_DEV_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_DEV }} \
            --command "kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml && kubectl -n cert-manager rollout status deploy/cert-manager --timeout=120s && kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=120s && kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=120s" -o json)
          echo "$RESULT" | jq -r '.logs'
          exit "$(echo "$RESULT" | jq -r '.exitCode')"
      - name: Apply cert-manager ClusterIssuers (Let's Encrypt)
        run: |
          RESULT=$(az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_DEV_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_DEV }} \
            --command "kubectl apply -f cluster-issuer.yaml" \
            --file k8s/cluster-addons/cert-manager/cluster-issuer.yaml -o json)
          echo "$RESULT" | jq -r '.logs'
          exit "$(echo "$RESULT" | jq -r '.exitCode')"
      - name: Render manifests (kustomize build - avoids command invoke's flat --file limitation)
        run: kubectl kustomize k8s/overlays/dev > /tmp/rendered-dev.yaml
      - name: kubectl apply (dev) via command invoke
        run: |
          RESULT=$(az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_DEV_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_DEV }} \
            --command "kubectl apply -f rendered-dev.yaml" \
            --file /tmp/rendered-dev.yaml -o json)
          echo "$RESULT" | jq -r '.logs'
          exit "$(echo "$RESULT" | jq -r '.exitCode')"
      - name: Wait for rollout
        run: |
          RESULT=$(az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_DEV_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_DEV }} \
            --command "kubectl -n demo-web rollout status deploy/demo-web --timeout=120s" -o json)
          echo "$RESULT" | jq -r '.logs'
          exit "$(echo "$RESULT" | jq -r '.exitCode')"

  deploy-prod:
    name: Deploy app - Prod
    needs: deploy-dev
    if: ${{ always() && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event.inputs.environment == '' || github.event.inputs.environment == 'prod') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WEBPLAT }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set image reference
        run: |
          sed -i \
            -e "s#REPLACE_WITH_ACR_LOGIN_SERVER#${{ vars.ACR_NAME_PROD }}.azurecr.io#g" \
            -e "s#REPLACE_WITH_IMAGE_TAG#${{ github.event.workflow_run.head_sha || github.sha }}#g" \
            k8s/overlays/prod/kustomization.yaml
      - name: Render manifests (kustomize build - avoids command invoke's flat --file limitation)
        run: kubectl kustomize k8s/overlays/prod > /tmp/rendered-prod.yaml
      - name: kubectl apply (prod) via command invoke
        run: |
          RESULT=$(az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_PROD_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_PROD }} \
            --command "kubectl apply -f rendered-prod.yaml" \
            --file /tmp/rendered-prod.yaml -o json)
          echo "$RESULT" | jq -r '.logs'
          exit "$(echo "$RESULT" | jq -r '.exitCode')"
      - name: Wait for rollout
        run: |
          RESULT=$(az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_PROD_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_PROD }} \
            --command "kubectl -n demo-web rollout status deploy/demo-web --timeout=120s" -o json)
          echo "$RESULT" | jq -r '.logs'
          exit "$(echo "$RESULT" | jq -r '.exitCode')"
