name: Webplat App Deploy

# Deploys the demo app onto the private AKS cluster via `az aks command
# invoke` - this is what lets a GitHub-hosted runner (no VNet line-of-sight)
# reach a cluster with no public API server, with zero extra networking
# (no VPN, self-hosted runner, or Bastion required).

on:
  workflow_run:
    workflows: ["Webplat Build & Push Demo App"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy the app to'
        type: choice
        options: [dev, prod]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy app - Dev
    if: ${{ github.event.inputs.environment == '' || github.event.inputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WEBPLAT }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: kubectl apply -k (dev) via command invoke
        run: |
          az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_DEV_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_DEV }} \
            --command "kubectl apply -k k8s/overlays/dev" \
            --file k8s
      - name: Wait for rollout
        run: |
          az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_DEV_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_DEV }} \
            --command "kubectl -n demo-web rollout status deploy/demo-web --timeout=120s"

  deploy-prod:
    name: Deploy app - Prod
    needs: deploy-dev
    if: ${{ always() && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') && (github.event.inputs.environment == '' || github.event.inputs.environment == 'prod') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WEBPLAT }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: kubectl apply -k (prod) via command invoke
        run: |
          az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_PROD_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_PROD }} \
            --command "kubectl apply -k k8s/overlays/prod" \
            --file k8s
      - name: Wait for rollout
        run: |
          az aks command invoke \
            -g ${{ vars.RESOURCE_GROUP_PROD_WEBPLAT }} \
            -n ${{ vars.AKS_NAME_PROD }} \
            --command "kubectl -n demo-web rollout status deploy/demo-web --timeout=120s"
