apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-web
resources:
  - ../../base
images:
  - name: demo-web
    # Substituted by webplat-app-deploy.yml at deploy time (sed) with the
    # real ACR login server and the git SHA that was just built and pushed.
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/demo-web
    newTag: REPLACE_WITH_IMAGE_TAG
patches:
  - target:
      kind: Deployment
      name: demo-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: demo-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev-webplat.ict-cloud.solutions
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev-webplat.ict-cloud.solutions
      - op: replace
        path: /spec/tls/0/secretName
        value: demo-web-tls-letsencrypt
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        # Confirmed working on -staging (Certificate READY, Order valid,
        # 2026-09-22) - now on the real issuer for a trusted cert.
        value: letsencrypt-prod
  - target:
      kind: NetworkPolicy
      name: demo-web-allow-ingress-from-agic
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.30.16.0/24
  - target:
      kind: NetworkPolicy
      name: demo-web-allow-ingress-from-agic-acme-solver
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.30.16.0/24
