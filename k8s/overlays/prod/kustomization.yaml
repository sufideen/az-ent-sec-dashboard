apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-web
resources:
  - ../../base
  # Prod keeps the Key Vault CSI TLS pattern (dev switched to cert-manager +
  # Let's Encrypt - see k8s/overlays/dev/kustomization.yaml). Not part of
  # base by default since it couples app pod readiness to Key Vault/
  # identity health (see k8s/base/deployment.yaml comment).
  - ../../base/tls-keyvault-csi
images:
  - name: demo-web
    # Substituted by webplat-app-deploy.yml at deploy time (sed) with the
    # real ACR login server and the git SHA that was just built and pushed.
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/demo-web
    newTag: REPLACE_WITH_IMAGE_TAG
patches:
  - target:
      kind: Deployment
      name: demo-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: webplat-tls-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: webplat-tls
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          # Unused by nginx itself (TLS terminates at the Application
          # Gateway) - mounting this is what triggers the Secrets Store
          # CSI driver to actually sync the TLS cert from Key Vault into
          # the webplat-tls Kubernetes Secret the Ingress references.
          name: webplat-tls-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
  - target:
      kind: HorizontalPodAutoscaler
      name: demo-web
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: Ingress
      name: demo-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.itsolutions.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.itsolutions.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: webplat-tls
  - target:
      kind: NetworkPolicy
      name: demo-web-allow-ingress-from-agic
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.31.16.0/24
  - target:
      kind: SecretProviderClass
      name: webplat-tls
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: 4a6ddd32-7da5-4f94-b001-d6a8c146a153
      - op: replace
        path: /spec/parameters/keyvaultName
        value: kvwebplatprod2su655bqyw7
      - op: replace
        path: /spec/parameters/tenantId
        value: fc1d277f-2fcb-4721-b141-1e117c362266
