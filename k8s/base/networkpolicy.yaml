# Default-deny, explicit allow: the site accepts traffic only from AGIC
# (the Application Gateway ingress add-on's pods live in kube-system) and
# needs no outbound access beyond DNS - it's a static site.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-web-default-deny
  namespace: demo-web
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-web-allow-ingress-from-agic
  namespace: demo-web
spec:
  podSelector:
    matchLabels:
      app: demo-web
  policyTypes:
    - Ingress
  ingress:
    # Bring-your-own-gateway AGIC: the Application Gateway itself (not a
    # cluster pod) sends health probes and proxied requests directly to pod
    # IPs, sourced from its own subnet - each overlay patches the CIDR below
    # to that environment's App Gateway subnet. Without this, probes time
    # out and the backend pool shows Unhealthy even though the pods are
    # Ready (confirmed by a real deployment: kube-system namespaceSelector
    # alone never matches this traffic since it isn't pod-sourced).
    - from:
        - ipBlock:
            cidr: 0.0.0.0/32
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-web-allow-dns-egress
  namespace: demo-web
spec:
  podSelector:
    matchLabels:
      app: demo-web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
