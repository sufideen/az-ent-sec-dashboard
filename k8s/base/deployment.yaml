apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: demo-web
  labels:
    app: demo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-web
          # Replaced by the kustomize image transformer in each overlay with
          # <acr-login-server>/demo-web:<git-sha> at deploy time.
          image: demo-web:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            # Unused by nginx itself (TLS terminates at the Application
            # Gateway) - mounting this is what triggers the Secrets Store
            # CSI driver to actually sync the TLS cert from Key Vault into
            # the webplat-tls Kubernetes Secret the Ingress references.
            # Without some pod mounting it, the SecretProviderClass alone
            # never produces that Secret.
            - name: webplat-tls-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: webplat-tls-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: webplat-tls
