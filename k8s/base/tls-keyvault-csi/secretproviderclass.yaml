# Syncs the TLS certificate from the webplat Key Vault into a Kubernetes TLS
# Secret via the AKS Key Vault Secrets Provider (CSI) add-on. The synced
# Secret (webplat-tls) is what the Ingress references for HTTPS.
#
# Prerequisite (one-time, per environment - see docs/webplat-architecture.md
# > Rotate the TLS cert): create the certificate object in Key Vault first,
# e.g.:
#   az keyvault certificate create --vault-name <kv-name> \
#     --name webplat-tls-cert \
#     --policy "$(az keyvault certificate get-default-policy)"
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: webplat-tls
  namespace: demo-web
spec:
  provider: azure
  secretObjects:
    - secretName: webplat-tls
      type: kubernetes.io/tls
      data:
        - objectName: webplat-tls-cert
          key: tls.key
        - objectName: webplat-tls-cert
          key: tls.crt
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # userAssignedIdentityID is the AKS Key Vault Secrets Provider add-on's
    # identity client ID - populate at deploy time (see kustomization.yaml
    # patches per overlay, or set via `kubectl patch` post-deploy).
    userAssignedIdentityID: "REPLACE_WITH_ADDON_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEY_VAULT_NAME"
    tenantId: "REPLACE_WITH_TENANT_ID"
    objects: |
      array:
        - |
          objectName: webplat-tls-cert
          objectType: secret
