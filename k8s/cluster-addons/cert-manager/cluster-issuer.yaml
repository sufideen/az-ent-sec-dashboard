# Cluster-scoped - not namespaced to demo-web, but applied via the dev
# overlay for convenience (see k8s/overlays/dev/kustomization.yaml).
# Requires cert-manager itself to already be installed (see
# .github/workflows/webplat-app-deploy.yml, "Install cert-manager" step).
#
# Two issuers on purpose: point the Ingress at -staging first to prove the
# HTTP-01 flow works end-to-end (browsers will show an untrusted "Fake LE"
# cert, but that's expected - it confirms the ACME mechanics, not the
# trust chain). Switch to -prod only once staging succeeds, since Let's
# Encrypt's production rate limit (5 duplicate certs/week per domain) is
# easy to burn through while debugging a new HTTP-01 setup.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: sufyan@ict-cloud.solutions
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: azure-application-gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sufyan@ict-cloud.solutions
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: azure-application-gateway
