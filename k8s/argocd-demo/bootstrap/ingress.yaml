# Publishes the Argo CD UI through the existing App Gateway (the API server
# stays private - Argo CD itself only needs outbound access to GitHub).
# Needs a DNS A record: argocd-dev.ict-cloud.solutions -> App Gateway
# public IP (same IP as dev-webplat.ict-cloud.solutions).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: azure-application-gateway
  tls:
    - hosts:
        - argocd-dev.ict-cloud.solutions
      secretName: argocd-server-tls-letsencrypt
  rules:
    - host: argocd-dev.ict-cloud.solutions
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
