# PSRule for Azure configuration - Well-Architected Framework baseline checks
# against the compiled Bicep templates in /bicep and /modules.
#
# Run locally:
#   Install-Module -Name PSRule.Rules.Azure -Scope CurrentUser
#   Invoke-PSRule -InputPath bicep/ -Module PSRule.Rules.Azure -Option tests/psrule/ps-rule.yaml
#
# CI usage: see pipelines/github/security-scan.yml (psrule job) and
# pipelines/azure-devops/azure-pipelines.yml (SecurityScan stage).

input:
  pathIgnore:
    - '**/*.md'
    - 'workbooks/**'
    - 'kql/**'

binding:
  targetType:
    - 'resourceType'
    - 'type'

configuration:
  AZURE_BICEP_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 30
  AZURE_RESOURCE_ALLOWED_LOCATIONS: []

rule:
  includeLocal: true
  baseline: 'Azure.Default'

# Suppress rules that do not apply to this platform's design (documented, not silent):
suppression:
  # Key Vault firewall default-deny is intentional per environment (dev allows
  # public access for iteration speed; test/prod deny - see key-vault.bicep).
  Azure.KeyVault.Firewall:
    - kv-*-dev-*

output:
  format: Wide
